[package]
name = "rusty-gui-widgets"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# `embedded-gui` is the runtime the generated project already compiles against. The
# `micromath` feature is what satisfies the crate's maths-backend requirement on
# no_std (see src/generate/esp.ts), and `embedded-graphics` brings the geometry.
# `add_custom_widget` / `CustomWidget` / `CustomCanvas` are available without the
# `rich_widgets` feature, so this crate does not pull it in.
[dependencies]
embedded-gui = { version = "0.2.7", default-features = false, features = ["embedded-graphics", "micromath"] }

# The integration test exercises the `CustomWidget` trait against this same runtime.
[dev-dependencies]
embedded-gui = "0.2.7"

# This crate is *not* built against the published runtime on its own: a Designer project patches `embedded-gui`
# to the vendored fork (`codegen/embedded-gui`), and the fork is what carries the parts a custom widget needs
# that upstream 0.2.7 does not have -- `CustomCanvas::fill_row`, which lets one row of pixels reach the display
# as one address window. The patch below only applies when this crate is the root of a build (its own test run,
# a check of this repository); inside a project the root manifest's patch does the same thing. Without it the
# standalone build would compile against upstream and fail on a method upstream does not have, which is exactly
# the kind of difference the vendored-crate marker exists to make visible.
[patch.crates-io]
embedded-gui = { path = "../embedded-gui" }
