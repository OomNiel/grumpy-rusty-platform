# Generated by Grumpy's Rusty Platform for VS Code.
# Board: Espressif ESP32-DevKitC V4 (ESP32, 4 MB flash)
# Template: display
# Regenerating this file will overwrite local edits.

[package]
name = "snapshot-project"
version = "0.1.0"
edition = "2024"
# esp-hal ~1.2.2 requires this Rust version.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The display this project was made for. A board like the DevKitC takes any module plugged into
# it, so the choice is recorded here; flip it and rebuild to use another. It also tells the
# Designer which panel -- and therefore which size and touch controller -- the project has.
default = ["panel-st7789"]
panel-st7789 = []
panel-ili9341 = []
panel-st7796 = []

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
log = "0.4.27"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
mipidsi = "0.10.0"
embedded-graphics = "0.8"
embedded-hal-bus = "0.3.0"
static_cell = "2.1.1"

# The debug profile is what the Debug button builds, and a design repaints a whole panel every frame: at
# opt-level 0, embedded-graphics spends most of that frame in iterator plumbing it is not allowed to inline.
# Level 1 keeps the variables a breakpoint can show, and the libraries are built as released -- which is where
# the pixels are actually drawn. Debugging is unaffected: the lines and the locals are still there.
[profile.dev]
opt-level = 1
debug = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
debug = true
