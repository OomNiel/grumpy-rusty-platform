# Generated by Grumpy's Rusty Platform for VS Code.
# Board: Raspberry Pi Pico 2 (RP2350)
# Template: blinky
# Regenerating this file will overwrite local edits.

[package]
name = "snapshot-project"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# NOTE: embassy-rp supplies the architecture glue (and the single `__pender`) for
# RP chips, so embassy-executor must NOT be given `platform-cortex-m` /
# `executor-thread` here — that defines a second `__pender` and fails to link.
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "executor-thread", "executor-interrupt", "rp235xa", "binary-info"] }

defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

[profile.release]
debug = true
lto = true
opt-level = "s"
