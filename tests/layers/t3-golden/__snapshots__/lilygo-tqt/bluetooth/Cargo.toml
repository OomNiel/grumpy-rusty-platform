# Generated by Grumpy's Rusty Platform for VS Code.
# Board: LilyGo T-QT (ESP32-S3) (ESP32S3, 4 MB flash)
# Template: bluetooth
# Regenerating this file will overwrite local edits.

[package]
name = "snapshot-project"
version = "0.1.0"
edition = "2024"
# esp-hal ~1.2.2 requires this Rust version.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
log = "0.4.27"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "ble", "log-04", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
trouble-host = { version = "0.7.0", features = ["default-packet-pool-mtu-255", "derive"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1.1"

[profile.release]
opt-level = "s"
lto = true
debug = true
