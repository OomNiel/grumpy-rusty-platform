# Generated by Grumpy's Rusty Platform for VS Code.
# Board: LilyGo T-QT (ESP32-S3) (ESP32S3, 4 MB flash)
# Template: designer
# Regenerating this file will overwrite local edits.

[package]
name = "snapshot-project"
version = "0.1.0"
edition = "2024"
# esp-hal ~1.2.2 requires this Rust version.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The display this project was made for. A board like the DevKitC takes any module plugged into
# it, so the choice is recorded here; flip it and rebuild to use another. It also tells the
# Designer which panel -- and therefore which size and touch controller -- the project has.
default = ["panel-gc9107"]
panel-gc9107 = []
panel-gc9a01 = []

# The SMTP keep-alive client. `src/smtp.rs` is written by the SMTP wizard and left in the
# project; this feature is what compiles it in and spawns its task (the wizard puts "smtp"
# in `default`). Switching it off in the Designer toolbar drops the module and the task from
# the build without deleting the file, which is what makes the toggle reversible.
smtp = []

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "esp-radio"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
log = "0.4.27"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
mipidsi = "0.10.0"
embedded-graphics = "0.8"
embedded-hal-bus = "0.3.0"
static_cell = "2.1.1"
esp32s3 = "0.36"
embedded-gui = { version = "0.2.7", default-features = false, features = ["rich-widgets", "embedded-graphics", "macros", "micromath"] }
rusty-gui-widgets = { path = "codegen/rusty-gui-widgets", default-features = false }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "log-04", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "dns", "udp"] }
embassy-sync = "0.8.0"

# Vendored alongside every Designer project (see crates/ in this extension): the shapes widget crate, the
# codegen fork that emits add_custom_widget calls for shapes instead of add_panel/add_spacer stubs, and the
# runtime fork that lets a design name values its renderers used to hard-code (a checkbox's box size, a gauge's
# tick and needle colours). Patched together because the fork's builders are what the fork's emitter calls.
[patch.crates-io]
embedded-gui-codegen = { path = "codegen/embedded-gui-codegen" }
embedded-gui = { path = "codegen/embedded-gui" }

[profile.release]
opt-level = "s"
lto = true
debug = true
