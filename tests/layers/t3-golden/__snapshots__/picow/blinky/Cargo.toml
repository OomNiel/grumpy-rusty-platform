# Generated by Grumpy's Rusty Platform for VS Code.
# Board: Raspberry Pi Pico W (RP2040)
# Template: blinky
# Regenerating this file will overwrite local edits.

[package]
name = "snapshot-project"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# NOTE: embassy-rp supplies the architecture glue (and the single `__pender`) for
# RP chips, so embassy-executor must NOT be given `platform-cortex-m` /
# `executor-thread` here — that defines a second `__pender` and fails to link.
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "executor-thread", "executor-interrupt", "rp2040"] }

# CYW43 Wi-Fi/Bluetooth chip, driven over PIO SPI. The firmware blobs live in
# ./firmware and are baked into the image with `aligned_bytes!`.
cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
static_cell = "2.1"
# static_cell performs an atomic compare-exchange. The Cortex-M0+ has no atomic CAS,
# so portable-atomic provides one via critical-section (as Embassy's examples do).
portable-atomic = { version = "1.5", features = ["critical-section"] }

defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
critical-section = "1.2"

[profile.release]
debug = true
lto = true
opt-level = "s"
